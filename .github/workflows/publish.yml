name: Discover 推荐包发布

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "articles/**"
      - "covers/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成三件套并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_release.py \
            --repo "${{ github.repository }}"